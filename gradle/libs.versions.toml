[versions]
kotlin = "2.1.0"
# The architecture tests are a separate build with a newer Kotlin, since Konsist is built with it. Once `kotlin` above
# catches up, they can share it (and become a regular subproject).
kotlin-architecture = "2.4.21"
# The oldest Kotlin versions Truthish supports, used for both the stdlib dependency and the language / API version. Wasm
# didn't really exist until the end of 1.8 and won't compile with anything older than 1.9.
kotlin-target-common = "1.6.21"
kotlin-target-wasm = "1.9.25"
dokka = "2.1.0"
kover = "0.9.4"
maven-publish = "0.35.0"
junit4 = "4.13.2"
opentest4j = "1.3.0"
konsist = "0.18.1"

[libraries]
junit4 = { module = "junit:junit", version.ref = "junit4" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-jvm-architecture = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-architecture" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
